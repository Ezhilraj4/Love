<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <meta name="theme-color" content="#fff0f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#fff0f3">

    <title>My Forever Love ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fff0f3;
            --primary: #ff4d6d;
            --border-pink: #ff8fa3;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
            height: 100%;
        }

        /* Fixed Dashed Border - Always on top */
        .page-border {
            position: fixed;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 3px dashed var(--border-pink);
            border-radius: 30px;
            pointer-events: none;
            z-index: 1000;
            animation: borderPulse 3s infinite;
        }

        @keyframes borderPulse {
            0%, 100% { border-color: var(--border-pink); }
            50% { border-color: var(--primary); }
        }

        #bg-hearts {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        /* Floating Card Style */
        .content-box {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            padding: 30px 20px;
            border-radius: 30px;
            border: 2px dashed var(--border-pink);
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .photo-frame {
            width: 200px; height: 250px;
            border: 3px dashed var(--border-pink);
            padding: 5px; background: white;
            border-radius: 15px; margin: 0 auto 15px;
            overflow: hidden;
            animation: swing 5s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        h1 { font-family: 'Dancing Script', cursive; font-size: 2.8rem; color: var(--primary); margin: 0; }
        h2 { color: var(--primary); font-size: 1.4rem; margin: 10px 0; }
        p { font-size: 0.95rem; line-height: 1.5; color: #444; }

        /* Game Grid */
        .emoji-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 12px; margin-top: 15px;
        }
        .emoji-btn {
            font-size: 1.8rem; background: white; border: 2px dashed var(--border-pink);
            border-radius: 15px; padding: 10px; cursor: pointer;
        }

        .scroll-down {
            position: absolute; bottom: 40px; font-size: 0.8rem;
            color: var(--primary); animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div class="page-border"></div>
    <div id="bg-hearts"></div>

    <section>
        <div class="content-box">
            <p>🎵 Neeyum Naanum Anbe...</p>
            <h1>My Everything</h1>
            <div class="photo-frame">
                <img src="photo1.jpg" alt="Memory 1">
            </div>
            <p>Scroll up to see our journey ✨</p>
        </div>
        <div class="scroll-down">Scroll Up ⬇️</div>
    </section>

    <div id="scroll-container"></div>

    <section>
        <div class="content-box">
            <h2>Tap a Surprise 🎁</h2>
            <div id="game-msg" style="font-weight: bold; color: var(--primary); min-height: 25px;">Choose an Emoji</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="reveal('💍')">💍</button>
                <button class="emoji-btn" onclick="reveal('🧁')">🧁</button>
                <button class="emoji-btn" onclick="reveal('🍓')">🍓</button>
                <button class="emoji-btn" onclick="reveal('🧸')">🧸</button>
                <button class="emoji-btn" onclick="reveal('🌈')">🌈</button>
                <button class="emoji-btn" onclick="reveal('🌸')">🌸</button>
            </div>
        </div>
    </section>

    <iframe style="display:none" width="0" height="0" src="https://www.youtube.com/embed/S_7M_I664_4?autoplay=1" frameborder="0" allow="autoplay"></iframe>

    <script>
        const journey = [
            {t:"Un Sirippu", d:"Un sirippu thaan en vazhkaiyoda brightness."},
            {t:"Together", d:"Nee en kooda irukum pothu enakku bayame illa."},
            {t:"Promise", d:"Un kooda kalyanam panni vazhanum nu aasai."},
            {t:"Butterflies", d:"Innum unna pakumbothu first time pakura mathiri iruku."},
            {t:"Long Calls", d:"Namma pesuna antha hours... en vazhkaiyoda best time."},
            {t:"Home", d:"Un madi thaan enakkana oru safe place."},
            {t:"The Love", d:"Un mela irukura anbu eppovumae kuraiyathu."},
            {t:"Sweetness", d:"Chocolate-ah vida nee thaan enakku romba sweet."},
            {t:"Memories", d:"Namma edutha ovvoru photo-vum oru azhagiya kavithai."},
            {t:"Beach Walk", d:"Un kaiya pudichitu kadal oram nadakanum nu aasai."},
            {t:"My Strength", d:"En kasta kaalathula koodave irundha un anbu."},
            {t:"Late Nights", d:"Thookam varama namma pesuna antha silly vishayangal."},
            {t:"First Meeting", d:"Antha nimidam thaan en vazhkaiya mathuna naal."},
            {t:"Your Care", d:"En chinna chinna vishayathaiyum nee kavanippa."},
            {t:"Our Song", d:"Intha paattu nammakaagave ezhuthunathu mathiri iruku."},
            {t:"Sunshine", d:"En kaalai pozhuthu un ninaivugaludan thaan thodanguthu."},
            {t:"Coffee Dates", d:"Namma sethu sapta antha coffee-oda vaasanai innum irukku."},
            {t:"Small Fights", d:"Namma sandai pottuttu samathanam aagura azhage thani."},
            {t:"Protector", d:"Nee enkooda irukkumbothu naanae thairiyama iruppen."},
            {t:"Destiny", d:"Namma meet pannathu thaan en vazhkaiyoda best luck."},
            {t:"Pure Soul", d:"Unnoda andha caring nature thaan enna korthathu."},
            {t:"Laughter", d:"Enna eppovum sirikka vaikirathu unakku romba pidikkum."},
            {t:"Trust", d:"Yaru illanalum nee eppovum enakku iruppa nu namburen."},
            {t:"Dream House", d:"Unkooda sethu oru azhagiya veedu katti vaalanum."},
            {t:"Support", d:"En dreams-ku nee thaan periya support."},
            {t:"Your Eyes", d:"Un kannai paathale en kavalai ellam maranthudum."},
            {t:"Happiness", d:"En vazhkaiyoda real meaning unna meet pannathu thaan."},
            {t:"Special Gift", d:"Kadavul enakku koduthu periya gift nee thaan."},
            {t:"My World", d:"Nee illatha oru ulagam enakku vendave venda."},
            {t:"Forever", d:"Indha anbu eppovumae kuraiyaadhu. I Love You!"}
        ];

        const container = document.getElementById('scroll-container');
        
        // Auto-generate 30 pages using 1.jpg, 2.jpg...
        journey.forEach((item, i) => {
            const photoNum = (i + 1); 
            container.innerHTML += `
                <section>
                    <div class="content-box">
                        <div class="photo-frame">
                            <img src="${photoNum}.jpg" alt="Memory ${photoNum}" onerror="this.src='https://via.placeholder.com/300x400?text=Photo+Missing'">
                        </div>
                        <h2>${photoNum}. ${item.t}</h2>
                        <p>${item.d}</p>
                    </div>
                </section>
            `;
        });

        // Floating Hearts
        function createHeart() {
            const h = document.createElement('div');
            h.innerHTML = '❤️';
            h.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:100vh; font-size:${Math.random()*20+10}px; color:#ff8fa3; animation:rise 5s linear forwards; z-index:0;`;
            document.getElementById('bg-hearts').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 400);

        const s = document.createElement('style');
        s.innerHTML = "@keyframes rise { to { transform: translateY(-110vh) rotate(360deg); } }";
        document.head.appendChild(s);

        function reveal(e) {
            const m = {"💍":"Mine Forever?", "🧁":"Sweetie!", "🍓":"Berry Love!", "🧸":"Hugs!", "🌈":"Colorful Life!", "🌸":"Beautiful!"};
            document.getElementById('game-msg').innerText = m[e];
        }
    </script>
</body>
</html>
