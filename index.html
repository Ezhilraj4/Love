<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <meta name="theme-color" content="#fff0f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>My Forever Love ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fff0f3;
            --primary: #ff4d6d;
            --border-pink: #ff8fa3;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
            height: 100%;
        }

        /* Top Bar Color Fix (Address bar visible-a irundhalum idhu merge aagum) */
        .top-padding {
            position: fixed; top: 0; width: 100%; height: env(safe-area-inset-top);
            background: var(--bg-color); z-index: 2000;
        }

        /* Fixed Dashed Border */
        .page-border {
            position: fixed;
            top: 20px; left: 15px; right: 15px; bottom: 20px;
            border: 3px dashed var(--border-pink);
            border-radius: 30px;
            pointer-events: none;
            z-index: 1000;
        }

        #bg-hearts {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        section {
            height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            scroll-snap-align: start;
            position: relative; z-index: 10;
            padding: 20px;
        }

        /* Animated Floating Card */
        .content-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 35px 20px;
            border-radius: 30px;
            border: 2px dashed var(--border-pink);
            max-width: 330px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

        /* Emoji Animation */
        .big-emoji { font-size: 5rem; margin-bottom: 20px; display: block; animation: pop 2s infinite; }
        @keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* Photo Frame (Only for First Page) */
        .photo-frame {
            width: 210px; height: 260px;
            border: 3px dashed var(--border-pink);
            padding: 6px; background: white;
            border-radius: 15px; margin: 0 auto 15px;
            animation: swing 5s ease-in-out infinite;
        }
        @keyframes swing { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--primary); margin: 0; }
        h2 { color: var(--primary); font-size: 1.5rem; margin: 10px 0; }
        p { font-size: 1rem; line-height: 1.6; color: #444; font-weight: 500; }

        .emoji-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .emoji-btn { font-size: 2rem; background: white; border: 2px dashed var(--border-pink); border-radius: 15px; padding: 12px; cursor: pointer; }

        .scroll-down { position: absolute; bottom: 50px; font-size: 0.85rem; color: var(--primary); animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }
    </style>
</head>
<body>

    <div class="top-padding"></div>
    <div class="page-border"></div>
    <div id="bg-hearts"></div>

    <section>
        <div class="content-box">
            <p>🎵 Neeyum Naanum Anbe...</p>
            <h1>For You</h1>
            <div class="photo-frame">
                <img src="photo1.jpg" alt="Our Best Moment" onerror="this.src='https://via.placeholder.com/300x400?text=Photo+1.jpg+Missing'">
            </div>
            <p>Scroll up to see 30 surprises I kept for you ✨</p>
        </div>
        <div class="scroll-down">Scroll Up ⬇️</div>
    </section>

    <div id="scroll-container"></div>

    <section>
        <div class="content-box">
            <h2>Pick a Gift 🎁</h2>
            <div id="game-msg" style="font-weight: bold; color: var(--primary); min-height: 30px;">Choose an Emoji</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="reveal('💍')">💍</button>
                <button class="emoji-btn" onclick="reveal('🧁')">🧁</button>
                <button class="emoji-btn" onclick="reveal('🍓')">🍓</button>
                <button class="emoji-btn" onclick="reveal('🧸')">🧸</button>
                <button class="emoji-btn" onclick="reveal('🌈')">🌈</button>
                <button class="emoji-btn" onclick="reveal('🌸')">🌸</button>
            </div>
        </div>
    </section>

    <iframe style="display:none" width="0" height="0" src="https://www.youtube.com/embed/S_7M_I664_4?autoplay=1" frameborder="0" allow="autoplay"></iframe>

    <script>
        const journey = [
            {e:"🥰", t:"nathu", d:"nathu jolly yaa iruthuchu ookuda ncc laa fun ahh iruthuchu."},
            {e:"🤝", t:"Together", d:"Nee en kooda irukum pothu enakku bayame illa."},
            {e:"💍", t:"Promise", d:"Un kooda kalyanam panni vazhanum nu aasai."},
            {e:"🦋", t:"Butterflies", d:"Innum unna pakumbothu first time pakura mathiri iruku."},
            {e:"📞", t:"Long Calls", d:"Namma pesuna antha hours... en vazhkaiyoda best time."},
            {e:"🏡", t:"Our Home", d:"Un madi thaan enakkana oru safe place."},
            {e:"🌹", t:"The Love", d:"Un mela irukura anbu eppovumae kuraiyathu."},
            {e:"🍫", t:"Sweetness", d:"Chocolate-ah vida nee thaan enakku romba sweet."},
            {e:"📸", t:"Memories", d:"Namma edutha ovvoru photo-vum oru azhagiya kavithai."},
            {e:"🌊", t:"Beach Walk", d:"Un kaiya pudichitu kadal oram nadakanum nu aasai."},
            {e:"🦁", t:"Strong Me", d:"Nee pakkathula irundha naanae oru katti-singam thaan."},
            {e:"🤫", t:"Secrets", d:"Namma matumae pesuna antha secret memories."},
            {e:"🧸", t:"Chellakutty", d:"Unna thitti thitti konjurathu thaan enakku pidikkum."},
            {e:"🎁", t:"Gift", d:"Kadavul enakku kodutha best gift nee thaan."},
            {e:"🌈", t:"Colors", d:"En vazhkaiya vanna mayama mathunathu nee thaan."},
            {e:"☕", t:"Coffee Date", d:"Udaney namma coffee sapda polama?"},
            {e:"🛡️", t:"Safety", d:"Un thol mela saayum bodhu kidaikira amithi vera engum illa."},
            {e:"⏳", t:"Time", d:"Un kooda irukura neram mattum podhave mattinguthu."},
            {e:"🌙", t:"Dreams", d:"Every night un ninaivugaludan thaan thunguren."},
            {e:"💎", t:"Diamond", d:"Nee enakkana oru vaira diamond."},
            {e:"🎈", t:"Happiness", d:"En sandhosham unna suthithaan irukku."},
            {e:"👣", t:"Steps", d:"Ovvoru adiyum unkooda vachathae perumai."},
            {e:"🍪", t:"Cookie", d:"Sweetest person in my world!"},
            {e:"☀️", t:"Sunshine", d:"En kaalai pozhudhu unna nenachi thaan thodangum."},
            {e:"🌍", t:"My World", d:"En ulagam full-ah nee thaan."},
            {e:"🍦", t:"Treat", d:"Namakkaana andha ice cream treat nyabagam irukka?"},
            {e:"🌸", t:"Beautiful", d:"Un manasu intha poo madhiri romba azhagu."},
            {e:"⭐", t:"Special", d:"En vazhkaiyoda shining star nee."},
            {e:"🏰", t:"Queen", d:"En idhayathoda raani nee thaan."},
            {e:"♾️", t:"Forever", d:"Indha anbu eppovumae kuraiyaadhu. I Love You!"}
        ];

        const container = document.getElementById('scroll-container');
        
        journey.forEach((item, i) => {
            container.innerHTML += `
                <section>
                    <div class="content-box">
                        <span class="big-emoji">${item.e}</span>
                        <h2>${i+1}. ${item.t}</h2>
                        <p>${item.d}</p>
                    </div>
                </section>
            `;
        });

        // Background Hearts
        function createHeart() {
            const h = document.createElement('div');
            h.innerHTML = '❤️';
            h.style.cssText = `position:fixed; left:${Math.random()*100}vw; top:100vh; font-size:${Math.random()*20+10}px; color:#ff8fa3; animation:rise 5s linear forwards; z-index:0;`;
            document.getElementById('bg-hearts').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 400);

        const s = document.createElement('style');
        s.innerHTML = "@keyframes rise { to { transform: translateY(-110vh) rotate(360deg); } }";
        document.head.appendChild(s);

        function reveal(e) {
            const m = {"💍":"Mine Forever?", "🧁":"Sweetie!", "🍓":"Berry Love!", "🧸":"Hugs!", "🌈":"Colorful Life!", "🌸":"Beautiful!"};
            document.getElementById('game-msg').innerText = m[e];
        }
    </script>
</body>
</html>
