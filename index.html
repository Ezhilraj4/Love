<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f3;
            --primary: #ff4d6d;
            --border-pink: #ff8fa3;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }

        /* Fixed Dashed Border - Always stays on top */
        .page-border {
            position: fixed;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 3px dashed var(--border-pink);
            border-radius: 30px;
            pointer-events: none;
            z-index: 1000;
            animation: borderPulse 3s infinite;
        }

        @keyframes borderPulse {
            0%, 100% { border-color: var(--border-pink); transform: scale(1); }
            50% { border-color: var(--primary); transform: scale(1.01); }
        }

        /* Floating Background Hearts */
        .bg-elements {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            position: relative;
            z-index: 10;
        }

        /* Card Animation */
        .content-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 40px 30px;
            border-radius: 30px;
            border: 2px dashed var(--border-pink);
            max-width: 330px;
            width: 85%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        .emoji { 
            font-size: 5rem; 
            margin-bottom: 20px; 
            display: block;
            animation: pop 2s infinite;
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 3rem; color: var(--primary); margin: 0; }
        h2 { color: var(--primary); font-size: 1.5rem; }
        p { line-height: 1.6; color: #555; font-weight: 500; }

        .photo-frame {
            width: 220px; height: 280px;
            border: 3px dashed var(--border-pink);
            padding: 8px; background: white;
            border-radius: 15px; margin-bottom: 20px;
            animation: swing 5s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        /* Game Grid */
        .emoji-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px; margin-top: 20px;
        }
        .emoji-btn {
            font-size: 2rem; background: white; border: 2px dashed var(--border-pink);
            border-radius: 15px; padding: 15px; cursor: pointer;
            transition: 0.3s;
        }
        .emoji-btn:hover { background: var(--soft-pink); transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="page-border"></div>
    <div class="bg-elements" id="bg-hearts"></div>

    <section>
        <div class="content-box">
            <p>🎵 Neeyum Naanum Anbe...</p>
            <h1>My Everything</h1>
            <div class="photo-frame">
                <img src="https://ibb.co/pBc1fNZc" alt="Partner">
            </div>
            <p>Scroll up for 30 surprises ✨</p>
        </div>
    </section>

    <div id="scroll-container"></div>

    <section>
        <div class="content-box">
            <h2>Pick a Gift 🎁</h2>
            <div id="game-msg" style="font-weight: bold; color: var(--primary);">Choose an Emoji</div>
            <div class="emoji-grid">
                <button class="emoji-btn" onclick="reveal('💍')">💍</button>
                <button class="emoji-btn" onclick="reveal('🧁')">🧁</button>
                <button class="emoji-btn" onclick="reveal('🍓')">🍓</button>
                <button class="emoji-btn" onclick="reveal('🧸')">🧸</button>
                <button class="emoji-btn" onclick="reveal('🌈')">🌈</button>
                <button class="emoji-btn" onclick="reveal('🌸')">🌸</button>
            </div>
        </div>
    </section>

    <iframe style="display:none" width="0" height="0" src="https://www.youtube.com/embed/S_7M_I664_4?autoplay=1" frameborder="0" allow="autoplay"></iframe>

    <script>
        const journey = [
            {e:"🥰", t:"Un Sirippu", d:"Un sirippu thaan en vazhkaiyoda brightness."},
            {e:"🤝", t:"Together", d:"Nee en kooda irukum pothu enakku bayame illa."},
            {e:"💍", t:"Promise", d:"Un kooda kalyanam panni vazhanum nu aasai."},
            {e:"🦋", t:"Butterflies", d:"Innum unna pakumbothu first time pakura mathiri iruku."},
            {e:"📞", t:"Long Calls", d:"Namma pesuna antha hours... en vazhkaiyoda best time."},
            {e:"🏡", t:"Our Home", d:"Un madi thaan enakkana oru safe place."},
            {e:"🌹", t:"The Love", d:"Un mela irukura anbu eppovumae kuraiyathu."},
            {e:"🍫", t:"Sweetness", d:"Chocolate-ah vida nee thaan enakku romba sweet."},
            {e:"📸", t:"Memories", d:"Namma edutha ovvoru photo-vum oru azhagiya kavithai."},
            {e:"🌊", t:"Beach Walk", d:"Un kaiya pudichitu kadal oram nadakanum nu aasai."},
            // ... add more unique quotes here up to 30
        ];

        const container = document.getElementById('scroll-container');
        
        // Dynamic Page Generation
        journey.forEach((item, i) => {
            container.innerHTML += `
                <section>
                    <div class="content-box">
                        <span class="emoji">${item.e}</span>
                        <h2>${i+1}. ${item.t}</h2>
                        <p>${item.d}</p>
                    </div>
                </section>
            `;
        });

        // Background Heart Animation
        function createHeart() {
            const h = document.createElement('div');
            h.innerHTML = '❤️';
            h.style.cssText = `
                position: fixed; left: ${Math.random() * 100}vw;
                top: 100vh; font-size: ${Math.random() * 20 + 10}px;
                color: #ff8fa3; opacity: 0.6;
                animation: rise ${Math.random() * 3 + 3}s linear forwards;
                z-index: 0;
            `;
            document.getElementById('bg-hearts').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 300);

        const style = document.createElement('style');
        style.innerHTML = `@keyframes rise { to { transform: translateY(-110vh) rotate(360deg); } }`;
        document.head.appendChild(style);

        function reveal(e) {
            const m = {"💍":"Will You Be Mine Forever?", "🧁":"You're My Sweetie!", "🍓":"Berry Much Love!", "🧸":"Hugs to You!", "🌈":"My Colorful Life!", "🌸":"Stay Beautiful!"};
            document.getElementById('game-msg').innerText = m[e];
        }
    </script>
</body>
</html>
